schema_version = 1
[benchmark]
id = "extreme-financial-events"
version = "1.4.1"
name = "Equity event stream benchmark"
description = "Single-case event-stream benchmark: Alphabet Q1 2026 earnings night — database-level publication gating, nine-metric pre-earnings forecast, 8-K reconciliation and 10-Q verification under a business clock"
[tasks]
include = ["tasks/equity-event-001/task*.toml"]
[defaults]
environment_profile = "local"
target_timeout_seconds = 2400
judge_timeout_seconds = 30
[environment_profiles.local]
type = "workspace"
[harness_requirements]
target_capabilities = ["agent.action_json"]
