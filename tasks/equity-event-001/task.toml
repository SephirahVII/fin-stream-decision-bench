schema_version = 1

[task]
id = "equity-event-001"
title = "Equity event desk: Alphabet Q1 2026 earnings night"
category = "financial-event-stream"

[input]
prompt_file = "prompt.md"

[environment]
initial_workspace = "environment/initial_workspace"

[[artifacts]]
path = "evidence/equity_event.json"
required = true
max_bytes = 8000000

[budget]
target_timeout_seconds = 2400
judge_timeout_seconds = 480

[workflow]
id = "benchmark.equity-event-stream"
fixture_file = "workflow-fixtures/scenario.json"
outputs = ["evidence/equity_event.json"]

[judge]
ground_truth_file = "judge/ground_truth.json"

[judge.aggregate]
method = "weighted_mean"
pass_threshold = 0.85

# --- deterministic checks (total 69 points) --------------------------------
# forecast 55, probabilities 5, one-off 2, reconciliation 2, 10-Q 2,
# timeliness 1, audit 2. No check is must_pass; one local failure cannot zero
# the case. The reported outcome label still requires the weighted mean to meet
# the pass threshold under the platform aggregation semantics.

[[judge.checks]]
id = "forecast_composite"
type = "command"
entrypoint = "judge/verify_ingest.py"
command = ["{python}", "/judge/verify_ingest.py", "--scenario", "/judge/ground_truth.json",
           "--submission", "/submission", "--result", "/judge-output/result.json",
           "--check", "forecast_composite"]
weight = 55
must_pass = false

[[judge.checks]]
id = "probabilities"
type = "command"
entrypoint = "judge/verify_ingest.py"
command = ["{python}", "/judge/verify_ingest.py", "--scenario", "/judge/ground_truth.json",
           "--submission", "/submission", "--result", "/judge-output/result.json",
           "--check", "probabilities"]
weight = 5
must_pass = false

[[judge.checks]]
id = "one_off_analysis"
type = "command"
entrypoint = "judge/verify_ingest.py"
command = ["{python}", "/judge/verify_ingest.py", "--scenario", "/judge/ground_truth.json",
           "--submission", "/submission", "--result", "/judge-output/result.json",
           "--check", "one_off_analysis"]
weight = 2
must_pass = false

[[judge.checks]]
id = "reconciliation_actuals"
type = "command"
entrypoint = "judge/verify_ingest.py"
command = ["{python}", "/judge/verify_ingest.py", "--scenario", "/judge/ground_truth.json",
           "--submission", "/submission", "--result", "/judge-output/result.json",
           "--check", "reconciliation_actuals"]
weight = 2
must_pass = false

[[judge.checks]]
id = "tenq_verification"
type = "command"
entrypoint = "judge/verify_ingest.py"
command = ["{python}", "/judge/verify_ingest.py", "--scenario", "/judge/ground_truth.json",
           "--submission", "/submission", "--result", "/judge-output/result.json",
           "--check", "tenq_verification"]
weight = 2
must_pass = false

[[judge.checks]]
id = "timeliness"
type = "command"
entrypoint = "judge/verify_ingest.py"
command = ["{python}", "/judge/verify_ingest.py", "--scenario", "/judge/ground_truth.json",
           "--submission", "/submission", "--result", "/judge-output/result.json",
           "--check", "timeliness"]
weight = 1
must_pass = false

[[judge.checks]]
id = "audit_integrity"
type = "command"
entrypoint = "judge/verify_ingest.py"
command = ["{python}", "/judge/verify_ingest.py", "--scenario", "/judge/ground_truth.json",
           "--submission", "/submission", "--result", "/judge-output/result.json",
           "--check", "audit_integrity"]
weight = 2
must_pass = false

# --- LLM rubrics (total 31 points) -----------------------------------------
# Each rubric separates factual compliance (binary criteria) from analytical
# quality (criteria graded through their weights / descriptive conditions).
# Candidate text is untrusted data; criteria only reference fields the
# submission schema already requires.

[[judge.checks]]
id = "evidence_chain"
type = "llm_rubric"
weight = 10
must_pass = false
connection_slot = "judge"
rubric_file = "judge/rubric_evidence.json"
submission_paths = ["evidence/equity_event.json"]

[[judge.checks]]
id = "analysis_logic"
type = "llm_rubric"
weight = 13
must_pass = false
connection_slot = "judge"
rubric_file = "judge/rubric_logic.json"
submission_paths = ["evidence/equity_event.json"]

[[judge.checks]]
id = "handover_quality"
type = "llm_rubric"
weight = 8
must_pass = false
connection_slot = "judge"
rubric_file = "judge/rubric_handover.json"
submission_paths = ["evidence/equity_event.json"]
